name: Source hygiene and Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reachable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked files and history for common exposure signatures
        run: python3 scripts/public_release_preflight.py
      - name: Check current source hygiene
        run: python3 scripts/source_hygiene.py

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install TMC with test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run complete regression suite
        run: python -m pytest -q
