[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT"
name = "tmc"
version = "1.0.0"
description = "Total Memory Core (TMC) v1.0.0 local-first AI memory infrastructure"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "networkx>=3.3",
  "scikit-learn>=1.5",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "pypdf>=4.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Package only Python application code, not operator memory data under data/.
[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["data", "data.*", "tests", "tests.*"]
namespaces = true

[tool.setuptools.package-data]
"app.ui" = ["templates/*.html"]
